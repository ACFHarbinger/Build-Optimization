# Slay the Spire 2 game profile — Ironclad, Strength Scaling archetype
#
# Deckbuilding, not equipment: `problem_type: deck` routes main.py to
# pipeline.decks.run_deck_optimization (core.deck_problem.DeckProblem --
# variable-size card *subset* selection) instead of
# pipeline.games.run_optimization (core.problem.BuildProblem --
# one-item-per-slot). See docs/deck-problem-mapping.md and
# moon/ROADMAP.md's "Slay the Spire 2 Vertical Slice" track.
name: "Slay the Spire 2 (Ironclad)"
description: "Deckbuilding roguelike -- Ironclad's Strength Scaling archetype (see reports/Slay the Spire 2 Guide.md)"
problem_type: "deck"

data:
