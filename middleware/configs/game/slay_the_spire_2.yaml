    attack: 1.0
    block: 0.7
    strength_gain: 3.0
    multi_hit: 2.5
    draw: 1.0
    vulnerable: 0.3
    block_conversion: 1.0
    hp_loss: -2.0
  synergy_multiplier: 1.5
  cost_penalty: 0.0
  slot_bonus: 2.0
  rarity_bonus: 1.0
  diminishing_returns: false
  diminishing_threshold: 200.0
