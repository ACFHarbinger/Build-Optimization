# infra/cloud/aws/cfn-template.yaml
# CloudFormation template for a serverless infrastructure stack.

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Backend stack for the Build Optimization.

Resources:
  # DynamoDB Database Table
  Build_optimizationTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

  # Lambda Function
  Build_optimizationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      Runtime: python3.11
      CodeUri: ./src
      Environment:
        Variables:
          TABLE_NAME: !Ref Build_optimizationTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Build_optimizationTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /status
            Method: get
