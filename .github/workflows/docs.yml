name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'moon/**'
      - 'middleware/src/**/*.py'
      - 'backend/**'
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'frontend/src-tauri/**/*.rs'
      - 'extension/src/**/*.ts'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'middleware/src/**/*.py'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-mkdocs:
    name: MkDocs portal build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra docs --group dev --no-install-project

      - name: Build MkDocs portal (strict)
        run: uv run mkdocs build --config-file docs/mkdocs.yml --strict --verbose

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 7

  docs-sphinx:
    name: Sphinx middleware reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra docs --group dev --no-install-project

      - name: Build Sphinx HTML
        run: uv run sphinx-build -b html docs/sphinx docs/_build/api/python --keep-going
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sphinx-api-docs
          path: docs/_build/api/python/
          retention-days: 14

  docs-cpp:
    name: Doxygen C++ backend reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Build Doxygen HTML
        run: doxygen docs/cpp/Doxyfile
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpp-api-docs
          path: docs/_build/api/cpp-doxygen/html/
          retention-days: 14

  docs-typescript:
    name: TypeDoc frontend + extension reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm install --workspaces
      - run: npx typedoc --options docs/frontend/typedoc.json
        continue-on-error: true
      - run: npx typedoc --options docs/extension/typedoc.json
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: typescript-api-docs
          path: docs/_build/api/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: [docs-mkdocs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra docs --group dev --no-install-project

      - name: Build MkDocs portal
        run: uv run mkdocs build --config-file docs/mkdocs.yml --strict

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
