name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
        working-directory: middleware
      - run: uv run ruff check .
        working-directory: middleware
      - run: uv run mypy src
        working-directory: middleware

  test-python:
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
        working-directory: middleware
      - run: uv run pytest tests -v --cov=src --cov-report=xml
        working-directory: middleware
      - uses: codecov/codecov-action@v4
        with:
          files: middleware/coverage.xml
          fail_ci_if_error: false

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: backend/pixi.toml
      - run: pixi run --manifest-path backend/pixi.toml build
      - run: pixi run --manifest-path backend/pixi.toml test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --workspaces
      - run: npm run test-frontend
      - run: npm run test-extension
      - run: cd frontend/src-tauri && cargo check
