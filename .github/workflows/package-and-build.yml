name: Package and Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Studio bundles
        run: docker build -f docker/Dockerfile --output type=local,dest=dist-studio .
      - uses: actions/upload-artifact@v7
        with:
          name: build-optimization-studio-linux
          path: dist-studio/*
